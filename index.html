<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OUI-NON - Quiz Fun</title>
  <style>
    *{ box-sizing: border-box; }
    :root{--green:#2dd4bf;--red:#ff6b6b;--accent:#06b6d4;--bg1:#0a0e27;--bg2:#1e293b;--bg3:#0f172a}
    html,body{ height:100%; margin:0; padding:0; }
    body { 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      background: linear-gradient(135deg, var(--bg1) 0%, #1a1f3a 35%, var(--bg2) 70%, var(--bg3) 100%);
      color:#f0f4f8; 
      overflow-x: hidden;
      position: relative;
    }

    body::before{ 
      content:""; position:fixed; z-index:0; 
      width:150vw; height:150vh; 
      background: radial-gradient(circle at 20% 50%, rgba(6,182,212,0.15) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(45,212,191,0.12) 0%, transparent 50%);
      animation: driftBG 20s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes driftBG{ 0%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,-20px) scale(1.05);} 100%{transform:translate(0,0) scale(1);} }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 50px;
      animation: slideDown 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header h1 {
      margin: 0;
      font-size: 56px;
      letter-spacing: 4px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      background: linear-gradient(120deg, var(--green), var(--accent), var(--red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(6,182,212,0.2);
      margin-bottom: 8px;
    }

    .header p {
      color: rgba(240,244,248,0.7);
      font-size: 16px;
      margin: 0;
      letter-spacing: 1px;
    }

    /* MAIN CONTENT */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }

    /* ACTION BUTTONS */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 600px;
      width: 100%;
      margin-bottom: 50px;
    }

    .btn-action {
      padding: 20px 30px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.5px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      color: #fff;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }

    .btn-action:hover {
      transform: translateY(-6px);
      border-color: rgba(6,182,212,0.5);
      box-shadow: 0 20px 50px rgba(6,182,212,0.2);
      background: linear-gradient(135deg, rgba(6,182,212,0.15), rgba(45,212,191,0.08));
    }

    .btn-action:active {
      transform: translateY(-2px);
    }

    .btn-create {
      background: linear-gradient(135deg, rgba(45,212,191,0.2), rgba(45,212,191,0.1));
      border-color: rgba(45,212,191,0.3);
      color: var(--green);
    }

    .btn-join {
      background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(6,182,212,0.1));
      border-color: rgba(6,182,212,0.3);
      color: var(--accent);
    }

    /* ACTIVE SESSIONS */
    .sessions-section {
      width: 100%;
      max-width: 700px;
    }

    .sessions-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(240,244,248,0.9);
      margin-bottom: 16px;
      text-align: center;
    }

    .sessions-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .session-card {
      padding: 16px;
      border-radius: 12px;
      background: linear-gradient(160deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
      text-align: center;
    }

    .session-card:hover {
      background: linear-gradient(160deg, rgba(6,182,212,0.1) 0%, rgba(6,182,212,0.05) 100%);
      border-color: rgba(6,182,212,0.3);
      transform: translateY(-4px);
    }

    .session-name {
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      margin-bottom: 8px;
    }

    .session-players {
      font-size: 12px;
      color: rgba(206,230,255,0.8);
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: rgba(240,244,248,0.6);
      font-size: 14px;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding-top: 40px;
      border-top: 1px solid rgba(255,255,255,0.05);
      margin-top: 40px;
    }

    .footer-brand {
      font-size: 11px;
      color: rgba(206,230,255,0.7);
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
      animation: fadeIn 0.3s ease;
    }

    .modal.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: linear-gradient(160deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      width: 90%;
      backdrop-filter: blur(12px);
      animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 20px;
      color: #fff;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: rgba(240,244,248,0.9);
      font-weight: 700;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      color: #fff;
      backdrop-filter: blur(8px);
      outline: none;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      border-color: rgba(6,182,212,0.5);
      background: rgba(6,182,212,0.08);
      box-shadow: 0 0 0 3px rgba(6,182,212,0.1);
    }

    .form-input::placeholder {
      color: rgba(240,244,248,0.4);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      border: 1px solid rgba(6,182,212,0.3);
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(45,212,191,0.1));
      color: var(--accent);
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, rgba(6,182,212,0.3), rgba(45,212,191,0.2));
      border-color: rgba(6,182,212,0.5);
      transform: translateY(-2px);
    }

    .btn-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-close:hover {
      background: rgba(255,255,255,0.2);
      transform: rotate(90deg);
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 36px;
      }
      
      .action-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header">
      <h1>OUI-NON</h1>
      <p>Quiz Fun pour toi et tes amis</p>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <!-- ACTION BUTTONS -->
      <div class="action-buttons">
        <button class="btn-action btn-create" onclick="openCreateModal()">
          ➕ CRÉER
        </button>
        <button class="btn-action btn-join" onclick="openJoinModal()">
          🔗 REJOINDRE
        </button>
      </div>

      <!-- ACTIVE SESSIONS -->
      <div class="sessions-section">
        <div class="sessions-title">🎮 Sessions actives</div>
        <div class="sessions-list" id="sessionsList">
          <div class="empty-state">Aucune session pour le moment...</div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer>
      <div class="footer-brand">by ANGE</div>
    </footer>
  </div>

  <!-- CREATE MODAL -->
  <div class="modal" id="createModal">
    <div class="modal-content">
      <button class="btn-close" onclick="closeCreateModal()">×</button>
      <div class="modal-title">Créer un quiz</div>
      <form onsubmit="createSession(event)">
        <div class="form-group">
          <label class="form-label">Ton nom</label>
          <input type="text" class="form-input" id="createName" placeholder="Ex: Alex" maxlength="20" required />
        </div>
        <div class="form-group">
          <label class="form-label">Nom du quiz</label>
          <input type="text" class="form-input" id="quizName" placeholder="Ex: Quiz Amusant" maxlength="30" required />
        </div>
        <button type="submit" class="btn-submit">DÉMARRER 🚀</button>
      </form>
    </div>
  </div>

  <!-- JOIN MODAL -->
  <div class="modal" id="joinModal">
    <div class="modal-content">
      <button class="btn-close" onclick="closeJoinModal()">×</button>
      <div class="modal-title">Rejoindre un quiz</div>
      <form onsubmit="joinSession(event)">
        <div class="form-group">
          <label class="form-label">Ton nom</label>
          <input type="text" class="form-input" id="joinName" placeholder="Ex: Alex" maxlength="20" required />
        </div>
        <div class="form-group">
          <label class="form-label">Code de session</label>
          <input type="text" class="form-input" id="sessionCode" placeholder="Ex: ABC123" maxlength="6" required />
        </div>
        <button type="submit" class="btn-submit">REJOINDRE ✓</button>
      </form>
    </div>
  </div>

  <script>
    // Gestion des modals
    function openCreateModal() {
      document.getElementById('createModal').classList.add('active');
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.remove('active');
    }

    function openJoinModal() {
      document.getElementById('joinModal').classList.add('active');
    }

    function closeJoinModal() {
      document.getElementById('joinModal').classList.remove('active');
    }

    // Fermer modal au clic extérieur
    document.querySelectorAll('.modal').forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.remove('active');
        }
      });
    });

    // Créer une session
    function createSession(e) {
      e.preventDefault();
      const name = document.getElementById('createName').value;
      const quizName = document.getElementById('quizName').value;
      
      // Générer un code de session
      const sessionCode = Math.random().toString(36).substr(2, 6).toUpperCase();
      
      // Sauvegarder la session
      let sessions = JSON.parse(localStorage.getItem('oui_non_sessions') || '[]');
      const session = {
        code: sessionCode,
        name: quizName,
        creator: name,
        players: [name],
        maxPlayers: 8,
        status: 'waiting',
        createdAt: new Date().toISOString()
      };
      sessions.push(session);
      localStorage.setItem('oui_non_sessions', JSON.stringify(sessions));
      
      // Rediriger vers la session
      window.location.href = `quiz.html?code=${sessionCode}&player=${encodeURIComponent(name)}`;
    }

    // Rejoindre une session
    function joinSession(e) {
      e.preventDefault();
      const name = document.getElementById('joinName').value;
      const code = document.getElementById('sessionCode').value.toUpperCase();
      
      // Vérifier si la session existe
      let sessions = JSON.parse(localStorage.getItem('oui_non_sessions') || '[]');
      const session = sessions.find(s => s.code === code);
      
      if (!session) {
        alert('❌ Code de session introuvable!');
        return;
      }
      
      if (session.players.length >= session.maxPlayers) {
        alert('❌ La session est pleine (max 8 joueurs)!');
        return;
      }
      
      // Ajouter le joueur à la session
      if (!session.players.includes(name)) {
        session.players.push(name);
      }
      localStorage.setItem('oui_non_sessions', JSON.stringify(sessions));
      
      // Rediriger vers la session
      window.location.href = `quiz.html?code=${code}&player=${encodeURIComponent(name)}`;
    }

    // Afficher les sessions actives
    function loadSessions() {
      let sessions = JSON.parse(localStorage.getItem('oui_non_sessions') || '[]');
      const sessionsList = document.getElementById('sessionsList');
      
      // Filtrer les sessions en attente
      const activeSessions = sessions.filter(s => s.status === 'waiting');
      
      if (activeSessions.length === 0) {
        sessionsList.innerHTML = '<div class="empty-state">Aucune session pour le moment...</div>';
        return;
      }
      
      sessionsList.innerHTML = activeSessions.map(session => `
        <div class="session-card" onclick="quickJoin('${session.code}')">
          <div class="session-name">${session.name}</div>
          <div class="session-players">👥 ${session.players.length}/${session.maxPlayers}</div>
        </div>
      `).join('');
    }

    // Rejoindre rapidement une session
    function quickJoin(code) {
      document.getElementById('joinModal').classList.add('active');
      document.getElementById('sessionCode').value = code;
    }

    // Charger les sessions au démarrage et auto-refresh
    loadSessions();
    setInterval(loadSessions, 2000);
  </script>
</body>
</html>
