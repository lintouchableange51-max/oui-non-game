<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OUI-NON - Quiz Culture Générale</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #1a1a1a;
      overflow-x: hidden;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(255,255,255,0.05) 0%, transparent 50%);
      animation: drift 20s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
    }

    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 60px;
      animation: slideDown 0.8s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 64px;
      font-weight: 900;
      margin: 0;
      color: white;
      letter-spacing: -1px;
      text-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    .header p {
      font-size: 14px;
      color: rgba(255,255,255,0.9);
      margin: 8px 0 0 0;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* MAIN CONTENT */
    .content {
      max-width: 600px;
      width: 100%;
      animation: slideUp 0.8s ease 0.2s both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-bottom: 30px;
    }

    .card h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 20px 0;
      color: #667eea;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #999;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .button {
      width: 100%;
      padding: 14px;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .button.secondary {
      background: #f0f3ff;
      color: #667eea;
      border: 2px solid #667eea;
    }

    .button.secondary:hover {
      background: #667eea;
      color: white;
    }

    .sessions-title {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: white;
      margin-bottom: 20px;
      text-align: center;
    }

    .session-card {
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideIn 0.4s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .session-info {
      flex: 1;
    }

    .session-name {
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .session-code {
      font-size: 12px;
      color: #999;
    }

    .session-players {
      font-size: 12px;
      color: #667eea;
      font-weight: 600;
    }

    .join-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      transition: all 0.3s ease;
    }

    .join-btn:hover {
      transform: scale(1.05);
    }

    .sessions-empty {
      text-align: center;
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      padding: 20px;
    }

    footer {
      position: absolute;
      bottom: 20px;
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 42px;
      }
      .card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>OUI-NON</h1>
      <p>Quiz Culture Générale</p>
    </div>

    <div class="content">
      <div class="card">
        <h2>🎮 Créer ou rejoindre</h2>
        <div class="input-group">
          <label>Ton nom</label>
          <input type="text" id="playerName" placeholder="Ex: Alex" />
        </div>
        <button class="button" onclick="createSession()">Créer une session</button>
        <div style="text-align: center; margin: 20px 0; color: #999;">— OU —</div>
        <div class="input-group">
          <label>Code de session</label>
          <input type="text" id="sessionCode" placeholder="Ex: ABC123" />
        </div>
        <button class="button secondary" onclick="joinSession()">Rejoindre</button>
      </div>

      <div class="sessions-title">Sessions actives</div>
      <div id="sessionsList"></div>
    </div>

    <footer>by ANGE • v1.0</footer>
  </div>

  <script>
    function createSession() {
      const playerName = document.getElementById('playerName').value.trim();
      if (!playerName) { alert('Entre ton nom !'); return; }

      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      let sessions = JSON.parse(localStorage.getItem('oui_non_sessions') || '[]');

      const session = {
        code,
        name: `Quiz ${code}`,
        creator: playerName,
        players: [playerName],
        maxPlayers: 8,
        status: 'waiting',
        createdAt: Date.now()
      };

      sessions.push(session);
      localStorage.setItem('oui_non_sessions', JSON.stringify(sessions));
      window.location.href = `quiz.html?code=${code}&player=${playerName}`;
    }

    function joinSession() {
      const playerName = document.getElementById('playerName').value.trim();
      const code = document.getElementById('sessionCode').value.trim().toUpperCase();

      if (!playerName) { alert('Entre ton nom !'); return; }
      if (!code) { alert('Entre le code !'); return; }

      let sessions = JSON.parse(localStorage.getItem('oui_non_sessions') || '[]');
      const session = sessions.find(s => s.code === code);

      if (!session) { alert('Session non trouvée !'); return; }
      if (session.players.length >= session.maxPlayers) { alert('Session pleine !'); return; }
      if (!session.players.includes(playerName)) {
        session.players.push(playerName);
        localStorage.setItem('oui_non_sessions', JSON.stringify(sessions));
      }

      window.location.href = `quiz.html?code=${code}&player=${playerName}`;
    }

    function loadSessions() {
      const sessions = JSON.parse(localStorage.getItem('oui_non_sessions') || '[]').filter(s => s.status === 'waiting');
      const list = document.getElementById('sessionsList');

      if (sessions.length === 0) {
        list.innerHTML = '<div class="sessions-empty">Aucune session active</div>';
        return;
      }

      list.innerHTML = sessions.map(s => `
        <div class="session-card">
          <div class="session-info">
            <div class="session-name">${s.name}</div>
            <div class="session-code">Code: ${s.code}</div>
            <div class="session-players">${s.players.length}/${s.maxPlayers} joueurs</div>
          </div>
          <button class="join-btn" onclick="quickJoin('${s.code}')">Rejoindre</button>
        </div>
      `).join('');
    }

    function quickJoin(code) {
      const playerName = document.getElementById('playerName').value.trim();
      if (!playerName) { alert('Entre ton nom !'); return; }
      document.getElementById('sessionCode').value = code;
      joinSession();
    }

    loadSessions();
    setInterval(loadSessions, 2000);
  </script>
</body>
</html>
