<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OUI-NON - Quiz Culture Générale</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { 
      margin: 0;
      padding: 0;
      box-sizing: border-box; 
    }

    html, body { 
      height: 100%;
      overflow-x: hidden;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255,255,255,0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 0%, transparent 40%);
      animation: floatBg 15s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatBg {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(40px, -30px); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 800px;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 60px;
      animation: slideDown 0.8s ease;
    }

    @keyframes slideDown {
      from { 
        opacity: 0; 
        transform: translateY(-40px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }

    .logo {
      font-family: 'Poppins', sans-serif;
      font-size: 72px;
      font-weight: 900;
      background: linear-gradient(120deg, #fff 0%, #e9d5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      text-shadow: 0 8px 32px rgba(139, 92, 246, 0.3);
      letter-spacing: -2px;
    }

    .tagline {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* MAIN CARD */
    .main-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      padding: 50px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
      animation: slideUp 0.8s ease 0.2s both;
    }

    @keyframes slideUp {
      from { 
        opacity: 0; 
        transform: translateY(40px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #6366f1;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .form-group input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      background: white;
    }

    .form-group input:focus {
      outline: none;
      border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
      transform: translateY(-2px);
    }

    .form-group input::placeholder {
      color: #9ca3af;
    }

    .divider {
      text-align: center;
      margin: 32px 0;
      font-size: 13px;
      color: #d1d5db;
      font-weight: 600;
    }

    /* BUTTONS */
    .btn {
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:active {
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #f3e8ff;
      color: #6366f1;
      border: 2px solid #8b5cf6;
    }

    .btn-secondary:hover {
      background: #e9d5ff;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.2);
    }

    /* SESSIONS LIST */
    .sessions-section {
      animation: slideUp 0.8s ease 0.4s both;
    }

    .sessions-title {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: white;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .session-item {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      animation: slideIn 0.4s ease;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }

    .session-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
    }

    @keyframes slideIn {
      from { 
        opacity: 0; 
        transform: translateX(-20px); 
      }
      to { 
        opacity: 1; 
        transform: translateX(0); 
      }
    }

    .session-info {
      flex: 1;
    }

    .session-name {
      font-weight: 700;
      font-size: 15px;
      color: #1f2937;
      margin-bottom: 4px;
    }

    .session-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #6b7280;
    }

    .session-code {
      background: #f3e8ff;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      color: #8b5cf6;
    }

    .session-players {
      background: #e0e7ff;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      color: #6366f1;
    }

    .join-btn {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .join-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    }

    .sessions-empty {
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      border: 1px dashed rgba(255, 255, 255, 0.2);
    }

    /* FOOTER */
    .footer {
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      letter-spacing: 1px;
      margin-top: 40px;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 48px;
      }

      .main-card {
        padding: 30px;
      }

      .tagline {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header">
      <div class="logo">OUI-NON</div>
      <div class="tagline">Quiz Culture Générale</div>
    </div>

    <!-- MAIN CARD -->
    <div class="main-card">
      <!-- CREATE SESSION -->
      <div class="form-group">
        <label>👤 Ton nom</label>
        <input type="text" id="playerName" placeholder="Ex: Alex" />
      </div>

      <button class="btn btn-primary" onclick="createSession()">➕ Créer une session</button>

      <div class="divider">— OU —</div>

      <!-- JOIN SESSION -->
      <div class="form-group">
        <label>🔐 Code de session</label>
        <input type="text" id="sessionCode" placeholder="Ex: ABC123" />
      </div>

      <button class="btn btn-secondary" onclick="joinSession()">🔗 Rejoindre</button>
    </div>

    <!-- SESSIONS LIST -->
    <div class="sessions-section">
      <div class="sessions-title">📊 Sessions actives</div>
      <div id="sessionsList"></div>
    </div>

    <div class="footer">
      ✨ by ANGE • Quiz v1.0
    </div>
  </div>

  <script>
    function createSession() {
      const playerName = document.getElementById('playerName').value.trim();
      if (!playerName) {
        alert('Entre ton nom SVP !');
        return;
      }

      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      let sessions = JSON.parse(localStorage.getItem('oui_non_sessions') || '[]');

      const session = {
        code,
        name: `Quiz ${code}`,
        creator: playerName,
        players: [playerName],
        maxPlayers: 8,
        status: 'waiting',
        createdAt: Date.now()
      };

      sessions.push(session);
      localStorage.setItem('oui_non_sessions', JSON.stringify(sessions));
      window.location.href = `quiz.html?code=${code}&player=${encodeURIComponent(playerName)}`;
    }

    function joinSession() {
      const playerName = document.getElementById('playerName').value.trim();
      const code = document.getElementById('sessionCode').value.trim().toUpperCase();

      if (!playerName) {
        alert('Entre ton nom SVP !');
        return;
      }

      if (!code) {
        alert('Entre le code de session !');
        return;
      }

      let sessions = JSON.parse(localStorage.getItem('oui_non_sessions') || '[]');
      const session = sessions.find(s => s.code === code);

      if (!session) {
        alert('❌ Session non trouvée !');
        return;
      }

      if (session.players.length >= session.maxPlayers) {
        alert('❌ Session pleine !');
        return;
      }

      if (!session.players.includes(playerName)) {
        session.players.push(playerName);
        localStorage.setItem('oui_non_sessions', JSON.stringify(sessions));
      }

      window.location.href = `quiz.html?code=${code}&player=${encodeURIComponent(playerName)}`;
    }

    function loadSessions() {
      const sessions = JSON.parse(localStorage.getItem('oui_non_sessions') || '[]')
        .filter(s => s.status === 'waiting')
        .sort((a, b) => b.createdAt - a.createdAt);

      const list = document.getElementById('sessionsList');

      if (sessions.length === 0) {
        list.innerHTML = '<div class="sessions-empty">Aucune session active 😴<br>Crée la première !</div>';
        return;
      }

      list.innerHTML = sessions.map(s => `
        <div class="session-item">
          <div class="session-info">
            <div class="session-name">🎮 ${s.name}</div>
            <div class="session-meta">
              <span class="session-code">Code: ${s.code}</span>
              <span class="session-players">👥 ${s.players.length}/${s.maxPlayers}</span>
            </div>
          </div>
          <button class="join-btn" onclick="quickJoin('${s.code}')">Rejoindre</button>
        </div>
      `).join('');
    }

    function quickJoin(code) {
      const playerName = document.getElementById('playerName').value.trim();
      if (!playerName) {
        alert('Entre ton nom SVP !');
        return;
      }
      document.getElementById('sessionCode').value = code;
      joinSession();
    }

    // Load initial sessions
    loadSessions();

    // Refresh sessions every 2 seconds
    setInterval(loadSessions, 2000);
  </script>
</body>
</html>
