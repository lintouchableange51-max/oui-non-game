<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OUI-NON - Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #1a1a1a;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 500px;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .header p {
      margin: 8px 0 0 0;
      font-size: 13px;
      opacity: 0.9;
      letter-spacing: 1px;
    }

    /* CONTENT */
    .content {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* WAITING ROOM */
    .waiting-room {
      text-align: center;
      width: 100%;
    }

    .waiting-room h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 24px;
      color: #1a1a1a;
      margin: 0 0 30px 0;
    }

    .players-list {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .player-item {
      padding: 12px;
      margin: 8px 0;
      background: white;
      border-radius: 8px;
      border-left: 4px solid #667eea;
      text-align: left;
    }

    .player-item.creator {
      border-left-color: #764ba2;
    }

    .start-btn {
      font-family: 'Poppins', sans-serif;
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: none;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .start-btn.show {
      display: inline-block;
    }

    /* QUIZ SCREEN */
    .quiz-screen {
      display: none;
      width: 100%;
    }

    .quiz-screen.active {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .question-counter {
      font-size: 12px;
      color: #667eea;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .question-text {
      font-family: 'Poppins', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0;
      line-height: 1.4;
    }

    .answers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      width: 100%;
    }

    .answer-btn {
      padding: 16px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-align: center;
    }

    .answer-btn:hover {
      border-color: #667eea;
      background: #f0f3ff;
      transform: translateY(-2px);
    }

    .answer-btn.selected {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: #667eea;
    }

    .answer-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* RESULTS */
    .results-screen {
      display: none;
      width: 100%;
    }

    .results-screen.active {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .results-title {
      font-family: 'Poppins', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #667eea;
      text-align: center;
    }

    .result-item {
      padding: 14px;
      background: #f8f9fa;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #e0e0e0;
    }

    .result-item.correct {
      border-left-color: #10b981;
      background: #f0fdf4;
    }

    .result-item.incorrect {
      border-left-color: #ef4444;
      background: #fef2f2;
    }

    .result-name {
      font-weight: 600;
      color: #1a1a1a;
    }

    .result-answer {
      font-size: 12px;
      padding: 4px 8px;
      background: white;
      border-radius: 4px;
      color: #667eea;
      font-weight: 600;
    }

    .next-btn {
      font-family: 'Poppins', sans-serif;
      padding: 12px 30px;
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      align-self: center;
    }

    .next-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    /* FOOTER */
    .footer {
      background: #f8f9fa;
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: #999;
      border-top: 1px solid #e0e0e0;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 28px;
      }
      
      .question-text {
        font-size: 18px;
      }
      
      .content {
        padding: 24px;
      }

      .answers-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header">
      <div>
        <h1>OUI-NON</h1>
        <p>by ANGE</p>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content">
      <!-- WAITING ROOM -->
      <div class="waiting-room" id="waitingRoom">
        <h2>⏳ En attente des joueurs...</h2>
        <div class="players-list" id="playersList"></div>
        <button class="start-btn" id="startBtn" onclick="startQuiz()">Démarrer le quiz 🚀</button>
      </div>

      <!-- QUIZ SCREEN -->
      <div class="quiz-screen" id="quizScreen">
        <div class="question-counter" id="questionNumber">Question 1 / 5</div>
        <h2 class="question-text" id="questionText">Question...</h2>
        <div class="answers-grid" id="answersContainer"></div>
      </div>

      <!-- RESULTS SCREEN -->
      <div class="results-screen" id="resultsScreen">
        <div class="results-title">✓ Résultats</div>
        <div class="results-list" id="resultsList"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Suivant →</button>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">by ANGE • Quiz OUI-NON v1.0</div>
  </div>

  <script>
    let currentSession = null;
    let currentPlayer = null;
    let currentQuestionIndex = 0;
    let currentQuestions = [];
    let isAnswered = false;

    const questions = [
      { text: 'La Terre est plate', correct: 'Non', options: ['Oui', 'Non'] },
      { text: 'Quel est le plus grand océan ?', correct: 'Océan Pacifique', options: ['Atlantique', 'Pacifique', 'Indien', 'Arctique'] },
      { text: 'Les poissons ont des oreilles', correct: 'Oui', options: ['Oui', 'Non'] },
      { text: 'En quelle année sur la Lune ?', correct: '1969', options: ['1965', '1969', '1972', '1974'] },
      { text: 'Le miel ne pourrit jamais', correct: 'Oui', options: ['Oui', 'Non'] },
      { text: 'Le plus haut sommet du monde ?', correct: 'Everest', options: ['Kilimandjaro', 'Everest', 'Denali', 'Elbrous'] },
      { text: 'Les araignées sont des insectes', correct: 'Non', options: ['Oui', 'Non'] },
      { text: 'Combien de continents y a-t-il ?', correct: '7', options: ['5', '6', '7', '8'] },
      { text: 'L\'or est le plus dense', correct: 'Non', options: ['Oui', 'Non'] },
      { text: 'Le plus grand pays du monde ?', correct: 'Russie', options: ['Canada', 'Russie', 'USA', 'Australie'] }
    ];

    function init() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const playerName = params.get('player');

      if (!code || !playerName) {
        window.location.href = 'index.html';
        return;
      }

      let sessions = JSON.parse(localStorage.getItem('oui_non_sessions') || '[]');
      currentSession = sessions.find(s => s.code === code);
      currentPlayer = playerName;

      if (!currentSession) {
        alert('Session non trouvée!');
        window.location.href = 'index.html';
        return;
      }

      updatePlayersList();
      if (currentSession.creator === currentPlayer) {
        document.getElementById('startBtn').classList.add('show');
      }

      setInterval(updatePlayersList, 1000);
    }

    function updatePlayersList() {
      let sessions = JSON.parse(localStorage.getItem('oui_non_sessions') || '[]');
      currentSession = sessions.find(s => s.code === currentSession.code);

      if (!currentSession) return;

      const playersList = document.getElementById('playersList');
      playersList.innerHTML = currentSession.players.map(player => 
        `<div class="player-item ${player === currentSession.creator ? 'creator' : ''}">
          👤 ${player} ${player === currentSession.creator ? '👑' : ''}
        </div>`
      ).join('');

      if (currentSession.status === 'started' && currentQuestionIndex === 0) {
        showQuiz();
      }
    }

    function startQuiz() {
      let sessions = JSON.parse(localStorage.getItem('oui_non_sessions') || '[]');
      currentSession = sessions.find(s => s.code === currentSession.code);
      currentSession.status = 'started';
      currentQuestions = questions.sort(() => Math.random() - 0.5).slice(0, 5);
      localStorage.setItem('oui_non_sessions', JSON.stringify(sessions));
      showQuiz();
    }

    function showQuiz() {
      document.getElementById('waitingRoom').style.display = 'none';
      currentQuestionIndex = 0;
      isAnswered = false;
      displayQuestion();
    }

    function displayQuestion() {
      if (currentQuestionIndex >= currentQuestions.length) {
        document.getElementById('resultsScreen').classList.remove('active');
        alert('🎉 Quiz terminé ! Bravo !');
        window.location.href = 'index.html';
        return;
      }

      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('questionNumber').textContent = `Question ${currentQuestionIndex + 1} / ${currentQuestions.length}`;
      document.getElementById('questionText').textContent = q.text;

      const container = document.getElementById('answersContainer');
      container.innerHTML = q.options.map(opt => 
        `<button class="answer-btn" onclick="selectAnswer('${opt}')">${opt}</button>`
      ).join('');

      isAnswered = false;
      document.getElementById('quizScreen').classList.add('active');
      document.getElementById('resultsScreen').classList.remove('active');
    }

    function selectAnswer(answer) {
      if (isAnswered) return;
      isAnswered = true;

      const q = currentQuestions[currentQuestionIndex];
      const correct = answer === q.correct;

      const resultsList = document.getElementById('resultsList');
      let allAnswers = [];

      let sessions = JSON.parse(localStorage.getItem('oui_non_sessions') || '[]');
      let session = sessions.find(s => s.code === currentSession.code);

      session.players.forEach((player, idx) => {
        const isCorrect = Math.random() > 0.5;
        const ans = isCorrect ? q.correct : q.options[Math.floor(Math.random() * q.options.length)];
        allAnswers.push({ player, ans, correct: ans === q.correct });
      });

      resultsList.innerHTML = allAnswers.map(item => 
        `<div class="result-item ${item.correct ? 'correct' : 'incorrect'}">
          <span class="result-name">${item.player}</span>
          <span class="result-answer">${item.correct ? '✓' : '✗'} ${item.ans}</span>
        </div>`
      ).join('');

      document.getElementById('quizScreen').classList.remove('active');
      document.getElementById('resultsScreen').classList.add('active');
    }

    function nextQuestion() {
      currentQuestionIndex++;
      displayQuestion();
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
